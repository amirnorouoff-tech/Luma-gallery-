<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumaGallery | گالری لوما</title>
    <link rel="stylesheet" href="style.css">
    <!-- فونت وزیرمتن برای زیبایی هرچه بیشتر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <!-- هدر اصلی سایت -->
    <header class="main-header">
        
        <!-- نوار بالایی: آیکون‌ها و لوگو -->
        <div class="header-top">
            <div class="header-icons">
                <span class="icon">🛒</span>
                <span class="icon">👤</span>
                <span class="icon">🔍</span>
            </div>
            
            <div class="header-logo">
                <img src="logo.png" alt="LumaGallery Logo">
            </div>
            
            <div class="header-spacer"></div> <!-- برای متوازن ماندن لوگو در مرکز -->
        </div>

        <!-- نوار پایینی: منو، اطلاعات و قیمت طلا -->
        <div class="header-bottom">
            <div class="header-right-side">
                <nav class="main-nav">
                    <a href="#">خانه</a>
                    <a href="#">فروشگاه ⌄</a>
                    <a href="#">سوالات متداول</a>
                    <a href="#">بلاگ</a>
                    <a href="#">شعب ما</a>
                    <a href="#">درباره ما</a>
                    <a href="#">تماس با ما ⌄</a>
                </nav>
            </div>
            
            <div class="header-left-side">
                <span class="contact-info">
                    <span class="email">info@lumagallery.com ✉</span>
                    <span class="phone">۰۲۱-۲۲۰۳۲۰۰۳ ☎</span>
                </span>
                <span class="gold-price">قیمت طلای ۱۸ عیار : ۲۵,۵۵۱,۰۰۰ تومان</span>
            </div>
        </div>
    </header>

    <!-- بنر اصلی (Hero Section) -->
    <section class="hero-section">
        <div class="hero-image">
            <img src="header.png" alt="Luma Gallery Banner">
        </div>
        <!-- متن‌های روی بنر -->
        <div class="hero-text">
            <h1>Luma Gallery</h1>
            <hr>
            <p>18K Gold Jewelry</p>
        </div>
    </section>

    <!-- نوار تبلیغاتی (اسنپ پی) -->
    <section class="promo-bar">
        <div class="promo-content">
            <span class="promo-logo">Snapp!<br><strong style="color:#00d2ff;">Pay</strong></span>
            <span class="promo-text">خرید اقساطی بدون کارمزد</span>
        </div>
    </section>

    <!-- بخش دسته‌بندی محصولات -->
    <section class="categories-section">
        <div class="category-box">
            <img src="image.png" alt="مردانه">
            <p>مردانه</p>
        </div>
        <div class="category-box">
            <img src="image.png" alt="دستبند">
            <p>دستبند</p>
        </div>
        <div class="category-box">
            <img src="image.png" alt="گردنبند">
            <p>گردنبند</p>
        </div>
        <div class="category-box">
            <img src="image.png" alt="گوشواره">
            <p>گوشواره</p>
        </div>
        <div class="category-box">
            <img src="image.png" alt="النگو">
            <p>النگو</p>
        </div>
        <div class="category-box">
            <img src="image.png" alt="آویز">
            <p>آویز</p>
        </div>
        <div class="category-box">
            <img src="image.png" alt="انگشتر">
            <p>انگشتر</p>
        </div>
        <div class="category-box">
            <img src="image.png" alt="محصولات کم اجرت">
            <p>محصولات کم اجرت</p>
        </div>
    </section>

</body>
</html>
